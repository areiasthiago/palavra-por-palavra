<!doctype html><html><head><meta charset="utf-8"><style>
<!-- Modelo da imagem de prévia (img/og.png, 1200x630). Para gerar: abrir no navegador em 1200x630 e salvar a tela. -->
@font-face{font-family:"Bricolage Grotesque";src:url("../fonts/bricolage-grotesque.woff2") format("woff2");font-weight:400 800}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f5f5f6;color:#1c1a1f;font-family:system-ui,"Segoe UI",sans-serif;position:relative;overflow:hidden}
.marca{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:14px;font:800 34px "Bricolage Grotesque"}
.marca img{width:52px;height:52px}
h1{position:absolute;left:64px;top:140px;width:640px;font:800 64px/1.04 "Bricolage Grotesque";letter-spacing:-.02em}
.mt{background:linear-gradient(transparent 58%,#d3c4ff 58%)}
.chips{position:absolute;left:64px;top:420px;width:640px;display:flex;flex-wrap:wrap;gap:12px}
.chips span{padding:8px 18px;border:3px solid #1c1a1f;border-radius:999px;background:#fff;font:700 26px "Bricolage Grotesque"}
.rodape{position:absolute;left:64px;bottom:40px;font-size:22px;color:#5d5b63}
.cartao{position:absolute;right:56px;top:70px;width:400px;height:480px;border:4px solid #1c1a1f;border-radius:30px;background:#fff;box-shadow:10px 10px 0 #1c1a1f;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:28px}
.lado{display:flex;align-items:center;gap:20px}
.lado img{width:150px;height:150px;border:4px solid #1c1a1f;border-radius:50%;background:#fff}
.lado b{font:800 30px/1.1 "Bricolage Grotesque"}
.sep{height:0;border-top:3px dashed #d6d5da}
</style></head><body>
<div class="marca"><img src="../img/icone.svg">Palavra por Palavra</div>
<h1>Quanto cada candidato <span class="mt">fala do que importa</span> pra você?</h1>
<div class="chips"><span>saúde</span><span>segurança</span><span>emprego</span><span>educação</span><span>casa</span></div>
<p class="rodape">Palavras nos planos de governo e em entrevistas · Eleições 2026</p>
<div class="cartao">
  <div class="lado"><img src="../img/flavio-serio.webp"><b>Flávio<br>Bolsonaro</b></div>
  <div class="sep"></div>
  <div class="lado"><img src="../img/lula-serio.webp"><b>Lula</b></div>
</div>
</body></html>
